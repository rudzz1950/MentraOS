# The .proto is the contract. This proves the committed generated sources still
# agree with it, and that protocol v1 stays additive against the shipping v0.
#
# Runner note: upstream MentraOS uses Blacksmith runners per its AGENTS.md. This
# fork has no access to those, so it uses a GitHub-hosted runner.
name: Protocol contract

on:
  pull_request:
    paths:
      - "proto/**"
      - "mobile/modules/bluetooth-sdk/**/MentraosBle.java"
      - "mobile/modules/bluetooth-sdk/**/mentraos_ble.pb.swift"
      - "scripts/check-proto-*.py"
      - ".github/workflows/proto-contract.yml"
  push:
    branches: [myglasses/main]

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-proto-compat.py reads the shipping schema from git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install grpcio-tools protobuf
      - name: Generated sources match the schema
        run: python3 scripts/check-proto-codegen.py
      - name: Protocol v1 is additive and wire-compatible with v0
        run: python3 scripts/check-proto-compat.py

  voice-biometrics:
    # The privacy charter forbids computing a biometric template, and a speaker
    # embedding is one. Diarization would otherwise arrive in a library call
    # with nobody deciding to add it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No voice biometrics in our own code
        run: python3 scripts/check-no-voice-biometrics.py
      - name: Report inherited surfaces (never fatal)
        run: python3 scripts/check-no-voice-biometrics.py --audit
